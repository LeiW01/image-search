[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fashion-image-search"
version = "0.1.0"
description = "本地双模型服饰商品以图搜商品原型"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "gradio>=5.38,<7",
  "huggingface-hub>=0.33,<2",
  "imagehash>=4.3,<5",
  "joblib>=1.5,<2",
  "numpy>=2.1,<3",
  "open-clip-torch>=3.0,<4",
  "pillow>=11,<13",
  "qdrant-client>=1.14,<2",
  "scikit-learn>=1.7,<2",
  "torch>=2.7,<3",
  "transformers>=4.53,<6",
]

[project.scripts]
fashion-search = "fashion_search.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-cov>=6.2,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: downloads and executes public model weights"]

